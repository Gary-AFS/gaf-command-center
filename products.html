<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Performance - GAF Command Center</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .back-link {
            font-size: 0.78rem;
            color: var(--accent);
            text-decoration: none;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .back-link:hover { opacity: 1; }

        .spotlight {
            background: linear-gradient(135deg, rgba(79,140,255,0.08), rgba(79,140,255,0.02));
            border: 1px solid rgba(79,140,255,0.2);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: var(--gap);
        }
        .spotlight-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 16px;
        }
        .spotlight-sku {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }
        .spotlight-name {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .spotlight-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
        }
        .metric-box {
            text-align: center;
        }
        .metric-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }
        .metric-value.accent { color: var(--accent); }
        .metric-value.green { color: var(--green); }
        .metric-value.amber { color: var(--amber); }
        .metric-value.red { color: var(--red); }
        .metric-label {
            font-size: 0.68rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 4px;
        }
        .metric-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .view-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .view-tab {
            font-size: 0.72rem;
            padding: 6px 14px;
            border-radius: 6px;
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s;
        }
        .view-tab:hover { border-color: var(--accent); color: var(--text-primary); }
        .view-tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .product-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .product-table th {
            text-align: left;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 8px 10px;
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            background: var(--card-bg);
            cursor: pointer;
            white-space: nowrap;
        }
        .product-table th:hover { color: var(--accent); }
        .product-table th.sort-active { color: var(--accent); }
        .product-table th.sort-active::after {
            content: ' ▼';
            font-size: 0.6rem;
        }
        .product-table td {
            padding: 10px 10px;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(30,30,46,0.4);
            white-space: nowrap;
        }
        .product-table tr:hover td {
            background: rgba(255,255,255,0.02);
        }
        .product-table td:first-child {
            color: var(--text-primary);
            font-weight: 600;
        }
        .product-table .num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .product-table .rank-cell {
            color: var(--text-muted);
            font-size: 0.72rem;
            width: 30px;
            text-align: center;
        }
        .product-table .sku-cell {
            color: var(--accent);
            font-weight: 600;
            font-size: 0.78rem;
        }
        .product-table .name-cell {
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }
        .stock-ok { color: var(--green); }
        .stock-low { color: var(--amber); }
        .stock-out { color: var(--red); }

        .table-wrapper {
            overflow-x: auto;
        }
        .table-wrapper::-webkit-scrollbar {
            height: 4px;
        }
        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--card-border);
            border-radius: 2px;
        }

        .products-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--gap) 24px 40px;
        }

        .sku-link {
            color: var(--accent);
            text-decoration: none;
        }
        .sku-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 820px) {
            .products-content { padding: var(--gap) 12px 32px; }
            .spotlight-metrics { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <div id="password-gate" class="gate">
        <div class="gate-inner">
            <div class="gate-logo">GAF</div>
            <h1 class="gate-title">Command Center</h1>
            <form id="password-form" autocomplete="off">
                <input type="password" id="password-input" class="gate-input" placeholder="Enter access code" autocomplete="off" autofocus>
                <button type="submit" class="gate-button">Access</button>
            </form>
            <p id="gate-error" class="gate-error"></p>
        </div>
    </div>

    <div id="dashboard" class="dashboard hidden">

        <header class="topbar">
            <div class="topbar-left">
                <a href="index.html" class="back-link">&larr; Dashboard</a>
                <span class="topbar-brand">GAF</span>
                <span class="topbar-title">Product Performance</span>
            </div>
            <div class="topbar-right">
                <span id="staleness-dot" class="staleness-dot"></span>
                <span id="last-updated" class="topbar-meta">Loading...</span>
            </div>
        </header>

        <div class="products-content">

            <div id="spotlight-section"></div>

            <section class="card">
                <h2 class="card-title">Top 10 SKUs</h2>
                <div class="view-tabs" id="view-tabs">
                    <button class="view-tab active" data-view="gp_visit">GP / Visit</button>
                    <button class="view-tab" data-view="revenue">Revenue</button>
                    <button class="view-tab" data-view="conversion">Conversion Rate</button>
                    <button class="view-tab" data-view="pageviews">Page Views</button>
                </div>
                <div class="card-body">
                    <div class="table-wrapper" id="product-table-container">
                        <div class="loading-placeholder">Loading...</div>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const PRODUCTS_DATA_URL = 'data/products.json';
        let productsData = null;
        let currentView = 'gp_visit';

        function fmtCur(n) {
            if (n == null) return '-';
            if (Math.abs(n) >= 1000) return '$' + n.toLocaleString('en-AU', { maximumFractionDigits: 0 });
            return '$' + n.toFixed(2);
        }
        function fmtPct(n) { return n != null ? n.toFixed(2) + '%' : '-'; }
        function fmtNum(n) { return n != null ? n.toLocaleString('en-AU') : '-'; }

        function stockClass(inv) {
            if (inv <= 0) return 'stock-out';
            if (inv < 10) return 'stock-low';
            return 'stock-ok';
        }

        function renderSpotlight(data) {
            const el = document.getElementById('spotlight-section');
            const s = data.spotlight;
            if (!s) { el.innerHTML = ''; return; }

            const invClass = stockClass(s.inventory);
            const invLabel = s.inventory <= 0 ? 'Out of Stock' : s.inventory;

            el.innerHTML = `
                <div class="spotlight">
                    <div class="spotlight-header">
                        <span class="spotlight-sku">${s.sku}</span>
                        <span class="spotlight-name">${s.name}</span>
                    </div>
                    <div class="spotlight-metrics">
                        <div class="metric-box">
                            <div class="metric-value accent">${fmtPct(s.conv_30d)}</div>
                            <div class="metric-label">Conv Rate (30d)</div>
                            <div class="metric-sub">${fmtPct(s.conv_3mo)} (3mo)</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-value green">${fmtCur(s.gp_visit_30d)}</div>
                            <div class="metric-label">GP / Visit (30d)</div>
                            <div class="metric-sub">${fmtCur(s.gp_visit_3mo)} (3mo)</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-value">${fmtCur(s.rev_visit_30d)}</div>
                            <div class="metric-label">Rev / Visit (30d)</div>
                            <div class="metric-sub">${fmtCur(s.rev_visit_3mo)} (3mo)</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-value">${fmtNum(s.qty_30d)}</div>
                            <div class="metric-label">Units Sold (30d)</div>
                            <div class="metric-sub">${s.qty_online_30d} online / ${s.qty_offline_30d} offline</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-value">${fmtNum(s.pageviews_30d)}</div>
                            <div class="metric-label">Page Views (30d)</div>
                            <div class="metric-sub">${fmtNum(s.pageviews_3mo)} (3mo)</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-value">${fmtCur(s.price)}</div>
                            <div class="metric-label">Price</div>
                            <div class="metric-sub">GP: ${s.gp_pct}%</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-value ${invClass}">${invLabel}</div>
                            <div class="metric-label">Inventory</div>
                            <div class="metric-sub">${fmtCur(s.revenue_30d)} rev (30d)</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getViewData(view) {
            if (!productsData) return [];
            switch(view) {
                case 'gp_visit': return productsData.top_by_gp_visit;
                case 'revenue': return productsData.top_by_revenue;
                case 'conversion': return productsData.top_by_conversion;
                case 'pageviews': return productsData.top_by_pageviews;
                default: return productsData.top_by_gp_visit;
            }
        }

        function renderTable(view) {
            const container = document.getElementById('product-table-container');
            const items = getViewData(view);
            if (!items || !items.length) {
                container.innerHTML = '<div class="panel-error">No data available</div>';
                return;
            }

            let sortCol;
            switch(view) {
                case 'gp_visit': sortCol = 'gp_visit_30d'; break;
                case 'revenue': sortCol = 'revenue_30d'; break;
                case 'conversion': sortCol = 'conv_30d'; break;
                case 'pageviews': sortCol = 'pageviews_30d'; break;
            }

            let html = '<table class="product-table"><thead><tr>';
            html += '<th class="rank-cell">#</th>';
            html += '<th>SKU</th>';
            html += '<th>Product</th>';
            html += `<th class="num ${sortCol === 'conv_30d' ? 'sort-active' : ''}">Conv %</th>`;
            html += `<th class="num ${sortCol === 'gp_visit_30d' ? 'sort-active' : ''}">GP/Visit</th>`;
            html += `<th class="num ${sortCol === 'revenue_30d' ? 'sort-active' : ''}">Revenue</th>`;
            html += '<th class="num">Qty (30d)</th>';
            html += `<th class="num ${sortCol === 'pageviews_30d' ? 'sort-active' : ''}">Views</th>`;
            html += '<th class="num">Price</th>';
            html += '<th class="num">GP%</th>';
            html += '<th class="num">Stock</th>';
            html += '</tr></thead><tbody>';

            items.forEach((p, i) => {
                const sClass = stockClass(p.inventory);
                const stockLabel = p.inventory <= 0 ? 'OOS' : fmtNum(p.inventory);
                const linkUrl = p.url || '#';

                html += `<tr>
                    <td class="rank-cell">${i + 1}</td>
                    <td class="sku-cell"><a href="${linkUrl}" target="_blank" rel="noopener" class="sku-link">${p.sku}</a></td>
                    <td class="name-cell">${p.name}</td>
                    <td class="num">${fmtPct(p.conv_30d)}</td>
                    <td class="num">${fmtCur(p.gp_visit_30d)}</td>
                    <td class="num">${fmtCur(p.revenue_30d)}</td>
                    <td class="num">${fmtNum(p.qty_30d)}</td>
                    <td class="num">${fmtNum(p.pageviews_30d)}</td>
                    <td class="num">${fmtCur(p.price)}</td>
                    <td class="num">${p.gp_pct}%</td>
                    <td class="num ${sClass}">${stockLabel}</td>
                </tr>`;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function renderProductsStaleness(data) {
            const dot = document.getElementById('staleness-dot');
            const label = document.getElementById('last-updated');
            if (!data || !data.last_updated) {
                dot.className = 'staleness-dot';
                label.textContent = 'Data unavailable';
                return;
            }
            const updated = new Date(data.last_updated);
            const now = new Date();
            const diffHours = (now - updated) / (1000 * 60 * 60);
            if (diffHours < 1) dot.className = 'staleness-dot fresh';
            else if (diffHours < 24) dot.className = 'staleness-dot stale';
            else dot.className = 'staleness-dot old';

            const timeStr = updated.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hour12: true });
            const dateStr = updated.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
            label.textContent = 'Updated ' + dateStr + ' ' + timeStr;
        }

        async function loadProducts() {
            try {
                const resp = await fetch(PRODUCTS_DATA_URL + '?t=' + Date.now());
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                productsData = await resp.json();
            } catch (err) {
                console.error('Failed to load product data:', err);
                document.getElementById('product-table-container').innerHTML =
                    '<div class="panel-error">Failed to load product data</div>';
                return;
            }

            renderProductsStaleness(productsData);
            renderSpotlight(productsData);
            renderTable(currentView);
        }

        // Override the showDashboard from app.js to load products instead
        const originalShowDashboard = showDashboard;
        showDashboard = function() {
            document.getElementById('password-gate').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            loadProducts();
        };

        // Tab click handlers
        document.getElementById('view-tabs').addEventListener('click', (e) => {
            const tab = e.target.closest('.view-tab');
            if (!tab) return;
            document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentView = tab.dataset.view;
            renderTable(currentView);
        });
    </script>
</body>
</html>
